  .rt-top, .rt-body{position:relative; z-index:1;}
  .rt-grain{
    position:absolute; inset:0; z-index:0; opacity:.5; mix-blend-mode:overlay; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
  }
  .rt-carbon{
    position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.35;
    background-image:
      linear-gradient(27deg, #000 5px, transparent 5px) 0 5px,
      linear-gradient(207deg, #000 5px, transparent 5px) 10px 0px,
      linear-gradient(27deg, #1a1420 5px, transparent 5px) 0px 10px,
      linear-gradient(207deg, #1a1420 5px, transparent 5px) 10px 5px,
      linear-gradient(90deg, #0d0a10 10px, transparent 10px),
      linear-gradient(#120c17 25%, #0a070d 25%, #0a070d 50%, transparent 50%, transparent 75%, #150f1b 75%, #150f1b);
    background-size:20px 20px;
    mask-image:linear-gradient(180deg, rgba(0,0,0,1) 0%, rgba(0,0,0,.5) 55%, rgba(0,0,0,0) 85%);
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,1) 0%, rgba(0,0,0,.5) 55%, rgba(0,0,0,0) 85%);
  }
  .rt-root::before{
    content:""; position:absolute; top:0; left:0; right:0; height:5px; z-index:2;
    background:linear-gradient(90deg, var(--purple) 0%, var(--purple) 60%, var(--chalk-dim) 60%, var(--chalk-dim) 80%, var(--chalk) 80%);
    box-shadow:0 0 14px 1px rgba(155,95,209,.65);
  }
  .rt-top{position:relative;}
  .rt-top::after{
    content:""; position:absolute; top:-1px; right:0; width:130px; height:140px;
    background:linear-gradient(160deg, var(--purple) 0%, var(--purple-deep) 100%); opacity:.7;
    clip-path:polygon(100% 0, 100% 100%, 15% 100%);
    box-shadow:-20px 0 40px -10px rgba(96,45,137,.5);
    pointer-events:none;
  }
  .rt-logo{
    width:50px; height:58px; border-radius:0; border:none;
    display:flex; align-items:center; justify-content:center; margin-right:14px; flex-shrink:0;
    background:transparent; overflow:hidden;
  }
  .rt-logo img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 0 10px rgba(155,95,209,.55));}
  .rt-topflex{display:flex; align-items:flex-start;}
  .rt-eyebrow{font-family:'Oswald',sans-serif; letter-spacing:.14em; text-transform:uppercase; font-size:11px; color:var(--purple-bright); font-weight:600;}
  .rt-h1{font-family:'Oswald',sans-serif; font-weight:700; font-size:28px; letter-spacing:.01em; margin:2px 0 0;}
  .rt-datebar{
    padding:max(12px, env(safe-area-inset-top)) 24px 10px; position:relative; z-index:2;
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--chalk-dim); border-bottom:1px solid var(--line);
  }
  .rt-datebar .rt-clock{color:var(--purple-bright); font-weight:600;}
  .rt-top{padding:18px 24px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start;}
  .rt-body{padding:22px 24px 28px; flex:1; overflow-y:auto;}
  .rt-btn{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.04em;
    border:1.5px solid rgba(245,245,245,0.4); background:var(--bg3); color:var(--chalk);
    padding:10px 16px; border-radius:5px; cursor:pointer; transition:all .15s ease;
    box-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
  .rt-btn:hover{background:var(--purple); border-color:var(--purple-bright);}
  .rt-btn:focus-visible{outline:2px solid var(--purple-bright); outline-offset:2px;}
  .rt-link{background:none; border:none; color:var(--chalk-dim); font-size:12px; text-decoration:underline; cursor:pointer; font-family:'Inter',sans-serif;}
  .rt-lockedas{display:inline-block; font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--chalk-dim); background:var(--bg2); border:1px solid var(--line); border-radius:20px; padding:5px 12px;}
  .rt-code-row{
    display:flex; align-items:center; gap:12px; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg2); margin-bottom:6px; font-size:13px; flex-wrap:wrap;
  }
  .rt-code-name{flex:1; min-width:120px; font-weight:600;}
  .rt-code-value{font-family:'Oswald',sans-serif; letter-spacing:.1em; color:var(--purple-bright);}
  .rt-code-status{font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:10px;}
  .rt-code-status.open{background:var(--good-bg); color:var(--good);}
  .rt-code-status.claimed{background:var(--bg3); color:var(--chalk-dim);}

  /* name select */
  .rt-namebox input{
    width:100%; padding:14px 16px; font-size:16px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg2); color:var(--chalk); font-family:'Inter',sans-serif;
  }
  .rt-namebox input:focus{outline:2px solid var(--purple-bright); outline-offset:1px;}
  .rt-suggest{margin-top:8px; display:flex; flex-direction:column; gap:4px; max-height:220px; overflow-y:auto;}
  .rt-suggest button{text-align:left; background:var(--bg2); border:1px solid var(--line); color:var(--chalk); padding:10px 14px; border-radius:8px; cursor:pointer; font-family:'Inter',sans-serif; font-size:14px;}
  .rt-suggest button:hover{background:var(--bg3);}
  .rt-addnew{margin-top:10px; font-size:13px; color:var(--chalk-dim);}

  /* checkin */
  .rt-goodbtn{
    width:100%; padding:26px 18px; border-radius:6px; border:2px solid var(--purple);
    background:var(--purple-deep); color:var(--chalk); font-family:'Oswald',sans-serif;
    font-size:22px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; text-align:center;
    position:relative;
  }
  .rt-goodbtn::before, .rt-goodbtn::after{
    content:""; position:absolute; top:6px; bottom:6px; width:10px; border:2px solid var(--chalk-dim); opacity:.5;
  }
  .rt-goodbtn::before{left:6px; border-right:none;}
  .rt-goodbtn::after{right:6px; border-left:none;}
  .rt-goodbtn:hover{background:var(--purple);}
  .rt-comment{margin-top:20px;}
  .rt-comment label{display:block; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--purple-bright); margin-bottom:8px;}
  .rt-comment textarea{
    width:100%; min-height:76px; padding:12px 14px; border-radius:10px; resize:vertical;
    border:1px solid var(--line); background:var(--bg2); color:var(--chalk); font-family:'Inter',sans-serif; font-size:14px;
  }
  .rt-comment textarea:focus{outline:2px solid var(--purple-bright); outline-offset:1px;}
  .rt-orline{display:flex; align-items:center; gap:10px; margin:22px 0 14px; color:var(--chalk-dim); font-size:12px; text-transform:uppercase; letter-spacing:.1em; font-family:'Oswald',sans-serif;}
  .rt-orline::before,.rt-orline::after{
    content:""; flex:1; height:8px;
    background-image: repeating-linear-gradient(90deg, var(--line) 0, var(--line) 2px, transparent 2px, transparent 10px);
    background-position:center; background-repeat:repeat-x; background-size:auto 100%;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .rt-chips{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .rt-chip{border:1.5px solid rgba(245,245,245,0.35); border-left:4px solid var(--chalk-dim); background:var(--bg3); border-radius:4px; padding:12px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.4); transition:border-color .15s ease, background .15s ease;}
  .rt-chip:hover{border-color:var(--purple-bright);}
  .rt-chip.active{border-color:var(--amber); border-left-color:var(--amber); background:var(--amber-bg);}
  .rt-chip.active.sev3{border-color:var(--red); border-left-color:var(--red); background:var(--red-bg);}
  .rt-chip-label{font-weight:600; font-size:13px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.03em;}
  .rt-sev{display:flex; gap:6px; margin-top:8px;}
  .rt-sev button{flex:1; font-size:11px; padding:6px 4px; border-radius:6px; border:1.5px solid rgba(245,245,245,0.35); background:var(--bg2); color:var(--chalk); cursor:pointer; font-weight:600;}
  .rt-sev button.sel1{background:var(--amber-bg); border-color:var(--amber); color:var(--chalk);}
  .rt-sev button.sel2{background:var(--amber); border-color:var(--amber); color:#241a06;}
  .rt-sev button.sel3{background:var(--red); border-color:var(--red); color:var(--chalk);}
  .rt-submitbar{margin-top:20px;}
  .rt-submitbar .rt-btn{width:100%; padding:14px; font-size:15px; background:var(--purple); border:1.5px solid var(--purple-bright); box-shadow:0 4px 14px rgba(96,45,137,0.55);}
  .rt-submitbar .rt-btn:hover{background:var(--purple-bright);}
  .rt-doneicon{font-family:'Oswald',sans-serif; font-size:22px;}

  /* coach dashboard */
  .rt-gate input{padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg2); color:var(--chalk); font-size:14px;}
  .rt-toolbar{display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .rt-toolbar input[type=text]{padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg2); color:var(--chalk); font-size:13px; flex:1; min-width:140px;}
  table.rt-grid{border-collapse:collapse; width:100%; font-size:12px;}
  table.rt-grid th{font-family:'Oswald',sans-serif; font-weight:600; color:var(--chalk-dim); text-align:center; padding:6px 4px; font-size:11px;}
  table.rt-grid td{text-align:center; padding:3px;}
  table.rt-grid td.rt-name{text-align:left; padding:2px 4px 2px 0; white-space:nowrap;}
  .rt-name-btn{
    background:none; border:none; color:var(--chalk); font-weight:600; font-size:12px;
    font-family:'Inter',sans-serif; cursor:pointer; padding:4px 4px; text-align:left;
  }
  .rt-name-btn:hover{text-decoration:underline; color:var(--purple-bright);}
  .rt-name-btn.flagged{color:var(--red);}
  .rt-cell{width:26px; height:26px; border-radius:3px; margin:auto; cursor:pointer; border:1px solid var(--line); position:relative;}
  .rt-cell.na{background:transparent;}
  .rt-cell.good{background:var(--good);}
  .rt-cell.amber{background:var(--amber);}
  .rt-cell.red{background:var(--red);}
  .rt-cell.dim{background:var(--bg2); opacity:.3;}
  .rt-statusfilter{display:flex; gap:8px; margin:0 0 16px; flex-wrap:wrap;}
  .rt-pill{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px;
    border:1.5px solid var(--line); background:var(--bg2); font-family:'Oswald',sans-serif;
    font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--chalk-dim);
    cursor:pointer; opacity:.45; transition:all .15s ease;
  }
  .rt-pill.active{opacity:1; color:var(--chalk); background:var(--bg3);}
  .rt-pill .rt-dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .rt-pill.good .rt-dot{background:var(--good);}
  .rt-pill.amber .rt-dot{background:var(--amber);}
  .rt-pill.red .rt-dot{background:var(--red);}
  .rt-pill.good.active{border-color:var(--good);}
  .rt-pill.amber.active{border-color:var(--amber);}
  .rt-pill.red.active{border-color:var(--red);}
  .rt-cell.has-comment::after{content:""; position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%; background:var(--purple-bright); border:1px solid var(--bg);}
  .rt-comments-feed{margin-top:22px;}
  .rt-comments-feed h3{font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--purple-bright); margin:0 0 10px;}
  .rt-comment-item{background:var(--bg2); border:1px solid var(--line); border-left:3px solid var(--purple); border-radius:8px; padding:10px 14px; margin-bottom:8px; font-size:13px;}
  .rt-comment-item .rt-c-meta{color:var(--chalk-dim); font-size:11px; margin-bottom:3px; text-transform:uppercase; letter-spacing:.04em;}
  .rt-legend{display:flex; gap:16px; font-size:12px; color:var(--chalk-dim); margin-top:16px; flex-wrap:wrap;}
  .rt-legend span{display:inline-flex; align-items:center; gap:6px;}
  .rt-dot{width:12px; height:12px; border-radius:4px; display:inline-block;}
  .rt-detail{margin-top:16px; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:14px; font-size:13px;}
  .rt-profile-header{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:13px; color:var(--purple-bright); margin-bottom:10px;}
  .rt-profile-row{display:flex; gap:10px; padding:6px 0; border-top:1px solid var(--line); font-size:12px;}
  .rt-profile-row:first-of-type{border-top:none;}
  .rt-profile-date{flex-shrink:0; width:78px; color:var(--chalk-dim); font-family:'Oswald',sans-serif; font-size:11px; text-transform:uppercase;}
  .rt-profile-row.red{color:var(--red);}
  .rt-profile-row.amber{color:var(--amber);}
  .rt-profile-row.good{color:var(--chalk-dim);}

  /* view tabs + calendar */
  .rt-viewtabs{display:flex; gap:8px; margin-bottom:16px;}
  .rt-viewtab{opacity:.6;}
  .rt-viewtab.active{opacity:1; background:var(--purple); border-color:var(--purple-bright);}
  .rt-cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .rt-cal-monthlabel{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:14px; font-weight:600;}
  .rt-cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;}
  .rt-cal-cell{
    aspect-ratio:1; border-radius:6px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:12px; font-family:'Oswald',sans-serif; cursor:default; position:relative; background:transparent; color:var(--chalk-dim);
  }
  .rt-cal-cell.weekday{border:none; color:var(--chalk-dim); font-size:11px; letter-spacing:.06em; aspect-ratio:auto;}
  .rt-cal-cell.empty{border:none; visibility:hidden;}
  .rt-cal-cell.good{background:var(--good); color:#08210f; cursor:pointer; font-weight:600;}
  .rt-cal-cell.amber{background:var(--amber); color:#241a06; cursor:pointer; font-weight:600;}
  .rt-cal-cell.red{background:var(--red); color:var(--chalk); cursor:pointer; font-weight:600;}
  .rt-cal-cell.na{cursor:default;}
  .rt-cal-cell.future{opacity:.3;}
  .rt-cal-cell.today{box-shadow:0 0 0 2px var(--purple-bright) inset;}
  .rt-recentlabel{font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--chalk-dim); margin:18px 0 8px;}
  .rt-recentstrip{display:flex; gap:8px;}
  .rt-recent-dot{
    flex:1; aspect-ratio:1; border-radius:6px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:11px; color:var(--chalk-dim); background:transparent;
  }
  .rt-recent-dot.good{background:var(--good); color:#08210f; border-color:var(--good); font-weight:600;}
  .rt-recent-dot.amber{background:var(--amber); color:#241a06; border-color:var(--amber); font-weight:600;}
  .rt-recent-dot.red{background:var(--red); color:var(--chalk); border-color:var(--red); font-weight:600;}
  .rt-recent-dot.today{border:1.5px dashed var(--purple-bright); color:var(--purple-bright); font-weight:600;}
  .rt-cal-cell:hover:not(.na):not(.future):not(.weekday):not(.empty){outline:2px solid var(--chalk);}
  .rt-loading{color:var(--chalk-dim); font-size:13px; padding:20px 0;}
</style>
<style>
  html, body { margin:0; padding:0; background:#0A0A0C; min-height:100vh; }
  .rt-root { border-radius:0; min-height:100vh; }
</style>
</head>

<script>
(function(){
  const body = document.getElementById('rt-body');
  const title = document.getElementById('rt-title');
  const coachToggle = document.getElementById('rt-coach-toggle');
  let currentName = null;
  let coachMode = false;

  const FLAGS = [
    {id:'sleep', label:'Sleep'},
    {id:'mood', label:'Mood'},
    {id:'hydration', label:'Hydration'},
    {id:'nutrition', label:'Nutrition'},
    {id:'fatigue', label:'Fatigue'},
    {id:'soreness', label:'Soreness'},
    {id:'tight', label:'Tightness'},
    {id:'pain', label:'Pain'}
  ];
  const SEV_LABELS = {1:'Mild',2:'Moderate',3:'Severe'};

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function dateLabel(ds){
    const [y,m,d] = ds.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined,{weekday:'short', month:'numeric', day:'numeric'});
  }
  function lastNDates(n){
    const out=[];
    for(let i=0;i<n;i++){
      const d=new Date();
      d.setDate(d.getDate()-i);
      out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    }
    return out.reverse();
  }

  function entryDocId(date, name){ return date + '__' + name.replace(/\//g,'-'); }

  async function getRoster(){
    try{
      const snap = await db.collection('players').get();
      return snap.docs.map(d => d.data().name).sort();
    }catch(e){ console.error(e); return []; }
  }
  async function addToRoster(name){
    try{
      await db.collection('players').doc(name.replace(/\//g,'-')).set({ name }, { merge:true });
    }catch(e){ console.error(e); }
  }
  async function getEntry(date, name){
    try{
      const doc = await db.collection('entries').doc(entryDocId(date, name)).get();
      return doc.exists ? doc.data() : null;
    }catch(e){ console.error(e); return null; }
  }
  async function setEntry(date, name, data){
    try{
      await db.collection('entries').doc(entryDocId(date, name)).set({ name, date, ...data });
      return true;
    }catch(e){ console.error(e); return false; }
  }
  async function getEntriesForDate(date){
    try{
      const snap = await db.collection('entries').where('date','==',date).get();
      return snap.docs.map(d => d.data());
    }catch(e){ console.error(e); return []; }
  }

  // ---------- SELF-SERVE PLAYER LOGIN (name + code they choose themselves) ----------
  // Returns { ok:true, name } or { ok:false, error }
  async function loginOrRegister(name, code){
    const ref = db.collection('players').doc(name);
    try{
      return await db.runTransaction(async (tx)=>{
        const doc = await tx.get(ref);
        if(!doc.exists){
          tx.set(ref, { name, code, createdAt: Date.now() });
          return { ok:true, name };
        }
        const data = doc.data();
        if(data.code !== code){
          return { ok:false, error:'That name is already registered with a different code. If this is you, ask your coach to reset your account.' };
        }
        return { ok:true, name };
      });
    }catch(e){
      console.error(e);
      return { ok:false, error:'Could not reach the database. Try again.' };
    }
  }
  async function listPlayers(){
    try{
      const snap = await db.collection('players').orderBy('name').get();
      return snap.docs.map(d => d.data());
    }catch(e){ console.error(e); return []; }
  }
  async function resetPlayer(name){
    try{
      await db.collection('players').doc(name).delete();
      return true;
    }catch(e){ console.error(e); return false; }
  }

  function cellStatus(entry){
    if(!entry) return 'na';
    if(entry.allGood) return 'good';
    const sevs = Object.values(entry.flags||{}).map(f=>f.severity);
    if(sevs.some(s=>s===3)) return 'red';
    if(sevs.length) return 'amber';
    return 'good';
  }

  // ---------- NAME SCREEN ----------
  const LOCK_KEY = 'hc_locked_player_name';

  async function renderNameScreen(){
    // Device already locked to a player? Skip straight to their calendar.
    const locked = localStorage.getItem(LOCK_KEY);
    if(locked){
      currentName = locked;
      renderPlayerCalendar(locked);
      return;
    }

    title.textContent = 'Team Readiness';
    body.innerHTML = `
      <div class="rt-namebox">
        <p style="color:var(--chalk-dim); font-size:13px; margin:0 0 10px;">First time here? Type your name and make up your own code \u2014 that code is yours permanently, so remember it. Already set up on a different phone? Enter the same name and code to log back in.</p>
        <input type="text" id="rt-name-input" placeholder="Your name" autocomplete="off">
        <input type="text" id="rt-code-input" placeholder="Create or enter your code" autocomplete="off" style="margin-top:10px; text-transform:uppercase; letter-spacing:.1em; text-align:center; font-family:'Oswald',sans-serif; font-size:18px;">
        <button class="rt-goodbtn" id="rt-code-submit" style="margin-top:14px;">Continue</button>
        <div id="rt-code-error" style="color:var(--red); font-size:12px; margin-top:12px; display:none;"></div>
      </div>
    `;
    const nameInput = document.getElementById('rt-name-input');
    const codeInput = document.getElementById('rt-code-input');
    const errorEl = document.getElementById('rt-code-error');
    const submitBtn = document.getElementById('rt-code-submit');

    async function tryContinue(){
      const name = nameInput.value.trim();
      const code = codeInput.value.trim().toUpperCase();
      if(!name || !code){
        errorEl.textContent = 'Enter both your name and a code.';
        errorEl.style.display = 'block';
        return;
      }
      if(code.length < 4){
        errorEl.textContent = 'Codes need to be at least 4 characters \u2014 pick something you will remember.';
        errorEl.style.display = 'block';
        return;
      }
      errorEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking...';
      const result = await loginOrRegister(name, code);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Continue';
      if(!result.ok){
        errorEl.textContent = result.error;
        errorEl.style.display = 'block';
        return;
      }
      localStorage.setItem(LOCK_KEY, result.name);
      currentName = result.name;
      renderPlayerCalendar(result.name);
    }
    submitBtn.onclick = tryContinue;
    [nameInput, codeInput].forEach(el => el.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryContinue(); }));
    nameInput.focus();
  }

  // ---------- CHECKIN SCREEN ----------
  let flagState = {};
  async function recentStripHtml(name, days){
    const list = lastNDates(days || 5);
    const today = todayStr();
    let html = '<div class="rt-recentstrip">';
    for(const ds of list){
      const isToday = ds === today;
      const entry = isToday ? null : await getEntry(ds, name);
      const status = isToday ? 'today' : (entry ? cellStatus(entry) : 'na');
      const dow = new Date(ds+'T00:00:00').toLocaleDateString(undefined,{weekday:'narrow'});
      html += `<div class="rt-recent-dot ${status}" title="${dateLabel(ds)}"><span>${dow}</span></div>`;
    }
    html += '</div>';
    return html;
  }
  async function renderCheckinScreen(){
    title.textContent = currentName;
    flagState = {};
    const today = todayStr();
    const existing = await getEntry(today, currentName);

    if(existing){
      renderAlreadyDone(existing);
      return;
    }

    const stripHtml = await recentStripHtml(currentName, 5);

    body.innerHTML = `
      <div class="rt-lockedas">Locked in as ${currentName}</div>

  // ---------- PLAYER'S OWN HISTORY (read-only calendar, landing page after name select) ----------
  let playerCalCursor = null;
  async function renderPlayerCalendar(name, monthDate){
    const cursor = monthDate || playerCalCursor || new Date();
    playerCalCursor = cursor;
    title.textContent = name;
    body.innerHTML = `<div class="rt-loading">Loading your history...</div>`;

    const year = cursor.getFullYear(), month = cursor.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const startWeekday = firstOfMonth.getDay();
    const todayVal = todayStr();

    const statusByDate = {};
    for(let d=1; d<=daysInMonth; d++){
      const ds = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      if(ds > todayVal || ds === todayVal) continue;
      const entry = await getEntry(ds, name);
      statusByDate[ds] = entry ? { status: cellStatus(entry), entry } : null;
    }

    const monthLabel = firstOfMonth.toLocaleDateString(undefined, {month:'long', year:'numeric'});
    const weekdayLabels = ['S','M','T','W','T','F','S'];
    const isCurrentOrFutureMonth = (new Date(year, month+1, 1)) > new Date();

    let cellsHtml = '';
    for(let i=0;i<startWeekday;i++) cellsHtml += `<div class="rt-cal-cell empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const ds = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const isFuture = ds > todayVal;
      const isToday = ds === todayVal;
      const info = statusByDate[ds];
      const status = isFuture ? 'na' : (isToday ? 'na' : (info ? info.status : 'na'));
      cellsHtml += `<div class="rt-cal-cell ${status}${isToday?' today':''}${isFuture?' future':''}" data-date="${ds}" ${(info && !isToday) ? '' : 'data-empty="1"'}>
        <span class="rt-cal-num">${d}</span>
      </div>`;
    }

    body.innerHTML = `
      <div class="rt-lockedas">Locked in as ${currentName}</div>
      <div class="rt-cal-nav" style="margin-top:14px;">
        <button class="rt-btn" id="rt-cal-prev">&larr;</button>
        <div class="rt-cal-monthlabel">${monthLabel}</div>
        <button class="rt-btn" id="rt-cal-next" ${isCurrentOrFutureMonth ? 'disabled style="opacity:.3;"' : ''}>&rarr;</button>
      </div>
      <div class="rt-cal-grid">
        ${weekdayLabels.map(w=>`<div class="rt-cal-cell weekday">${w}</div>`).join('')}
        ${cellsHtml}
      </div>
      <div class="rt-legend">
        <span><span class="rt-dot" style="background:var(--good);"></span> All good</span>
        <span><span class="rt-dot" style="background:var(--amber);"></span> Flagged</span>
        <span><span class="rt-dot" style="background:var(--red);"></span> Severe/Pain</span>
      </div>
      <div id="rt-player-cal-detail"></div>
      <button class="rt-goodbtn" id="rt-goto-checkin" style="margin-top:22px;">Check in for today &rarr;</button>
    `;

    document.getElementById('rt-goto-checkin').onclick = ()=> renderCheckinScreen();
    document.getElementById('rt-cal-prev').onclick = ()=> renderPlayerCalendar(name, new Date(year, month-1, 1));
    const nextBtn = document.getElementById('rt-cal-next');
    if(!isCurrentOrFutureMonth){
      nextBtn.onclick = ()=> renderPlayerCalendar(name, new Date(year, month+1, 1));
    }

    document.querySelectorAll('.rt-cal-cell[data-date]').forEach(cell=>{
      if(cell.dataset.empty) return;
      cell.onclick = ()=>{
        const ds = cell.dataset.date;
        const info = statusByDate[ds];
        const det = document.getElementById('rt-player-cal-detail');
        if(!info){ det.innerHTML = `<div class="rt-detail">No check-in on ${dateLabel(ds)}.</div>`; return; }
        const e = info.entry;
        let text;
        if(e.allGood) text = 'All good';
        else {
          text = Object.entries(e.flags||{}).map(([id,v])=>{
            const label = FLAGS.find(f=>f.id===id)?.label || id;
            return `${label} (${SEV_LABELS[v.severity]})`;
          }).join(', ');
        }
        const commentLine = e.comment ? `<br><em>"${e.comment}"</em>` : '';
        det.innerHTML = `<div class="rt-detail">${dateLabel(ds)}: ${text}${commentLine}</div>`;
      };
    });
  }

      <button class="rt-pill red${statusFilter.red?' active':''}" data-status="red"><span class="rt-dot"></span>Severe/Pain</button>

  function wireStatusPills(onChange){

  async function renderCoachDashboard(days){
    title.textContent = 'Team Trends';
    body.innerHTML = `<div class="rt-loading">Loading check-ins...</div>`;
    const dates = lastNDates(days);
    const roster = await getRoster();

    // gather entries per date directly from Firestore
    const entriesByPlayerDate = {}; // name -> date -> entry
    for(const date of dates){
      const entries = await getEntriesForDate(date);
      entries.forEach(entry => {
        if(!entriesByPlayerDate[entry.name]) entriesByPlayerDate[entry.name] = {};
        entriesByPlayerDate[entry.name][date] = entry;
      });
    }
    const activePlayers = Object.keys(entriesByPlayerDate).sort();

    body.innerHTML = `
      <div class="rt-viewtabs">
        <button class="rt-btn rt-viewtab active" data-view="grid">Grid</button>
        <button class="rt-btn rt-viewtab" data-view="calendar">Calendar</button>
        <button class="rt-btn rt-viewtab" data-view="codes">Codes</button>
      </div>
      <div class="rt-toolbar">
        <button class="rt-btn" data-days="7">Last 7 days</button>
        <button class="rt-btn" data-days="14">Last 14 days</button>
        <input type="text" id="rt-search" placeholder="Filter players...">
      </div>
      ${statusPillsHtml()}
      <div style="overflow-x:auto;">
        <table class="rt-grid" id="rt-table"></table>
      </div>
      <div class="rt-legend">
        <span><span class="rt-dot" style="background:var(--good);"></span> All good</span>
        <span><span class="rt-dot" style="background:var(--amber);"></span> Flagged (mild/moderate)</span>
        <span><span class="rt-dot" style="background:var(--red);"></span> Severe / pain</span>
        <span><span class="rt-dot" style="background:transparent; border:1px solid var(--line);"></span> No check-in</span>
        <span><span class="rt-dot" style="background:var(--purple-bright); border-radius:50%;"></span> Has comment</span>
      </div>
      <div id="rt-detail"></div>
      <div class="rt-comments-feed">
        <h3>Recent Comments</h3>
        <div id="rt-comments-list"></div>
      </div>
    `;
    document.querySelectorAll('[data-days]').forEach(b=> b.onclick = ()=> renderCoachDashboard(Number(b.dataset.days)));
    document.querySelectorAll('.rt-viewtab').forEach(b=> b.onclick = ()=>{ if(b.dataset.view === 'calendar') renderCoachCalendar(); else if(b.dataset.view === 'codes') renderCoachCodes(); });
    wireStatusPills(()=> renderCoachDashboard(days));

    function draw(filter){
      const table = document.getElementById('rt-table');
      const shown = activePlayers.filter(n=>{
        if(!n.toLowerCase().includes((filter||'').toLowerCase())) return false;
        const playerDates = entriesByPlayerDate[n] || {};
        return dates.some(d=>{
          const s = cellStatus(playerDates[d]);
          return s !== 'na' && statusFilter[s];
        });
      });
      let html = '<tr><th style="text-align:left;">Player</th>' + dates.map(d=>`<th>${dateLabel(d)}</th>`).join('') + '</tr>';
      if(!shown.length){
        html += `<tr><td colspan="${dates.length+1}" style="padding:20px; color:var(--chalk-dim);">No check-ins yet in this range.</td></tr>`;
      }
      shown.forEach(name=>{
        const playerDates = entriesByPlayerDate[name] || {};
        const hasRed = dates.some(d => cellStatus(playerDates[d]) === 'red');
        html += `<tr><td class="rt-name"><button class="rt-name-btn${hasRed ? ' flagged' : ''}" data-name="${name}">${hasRed ? '&#9679; ' : ''}${name}</button></td>`;
        dates.forEach(date=>{
          const entry = playerDates[date];
          const rawStatus = cellStatus(entry);
          const status = (rawStatus === 'na' || statusFilter[rawStatus]) ? rawStatus : 'dim';
          const hasComment = entry && entry.comment ? ' has-comment' : '';
          html += `<td><div class="rt-cell ${status}${hasComment}" data-name="${name}" data-date="${date}"></div></td>`;
        });
        html += '</tr>';
      });
      table.innerHTML = html;

      function entrySummary(name, date){
        const entry = entriesByPlayerDate[name]?.[date];
        if(!entry) return { text:'No check-in', comment:null, status:'na' };
        const commentTxt = entry.comment || null;
        if(entry.allGood) return { text:'All good', comment:commentTxt, status:'good' };
        const items = Object.entries(entry.flags||{}).map(([id,v])=>{
          const label = FLAGS.find(f=>f.id===id)?.label || id;
          return `${label} (${SEV_LABELS[v.severity]})`;
        }).join(', ');
        return { text: items, comment: commentTxt, status: cellStatus(entry) };
      }

      table.querySelectorAll('.rt-cell').forEach(cell=>{
        cell.onclick = ()=>{
          const name = cell.dataset.name, date = cell.dataset.date;
          const s = entrySummary(name, date);
          const commentLine = s.comment ? `<br><em>"${s.comment}"</em>` : '';
          document.getElementById('rt-detail').innerHTML = `<div class="rt-detail">${name} \u2014 ${dateLabel(date)}: ${s.text}.${commentLine}</div>`;
        };
      });

      table.querySelectorAll('.rt-name-btn').forEach(btn=>{
        btn.onclick = ()=>{
          const name = btn.dataset.name;
          const rows = dates.map(date=>{
            const s = entrySummary(name, date);
            const commentLine = s.comment ? ` &mdash; <em>"${s.comment}"</em>` : '';
            return `<div class="rt-profile-row ${s.status}"><span class="rt-profile-date">${dateLabel(date)}</span><span>${s.text}${commentLine}</span></div>`;
          }).join('');
          document.getElementById('rt-detail').innerHTML = `
            <div class="rt-detail">
              <div class="rt-profile-header">${name} \u2014 ${dates.length}-day history</div>
              ${rows}
            </div>`;
        };
      });
    }
    draw('');
    document.getElementById('rt-search').addEventListener('input', (e)=> draw(e.target.value));

    // recent comments feed, newest first
    const allComments = [];
    Object.entries(entriesByPlayerDate).forEach(([name, byDate])=>{
      Object.entries(byDate).forEach(([date, entry])=>{
        if(entry.comment){ allComments.push({name, date, comment:entry.comment, ts:entry.ts||0}); }
      });
    });
    allComments.sort((a,b)=> b.ts - a.ts);
    const listEl = document.getElementById('rt-comments-list');
    if(!allComments.length){
      listEl.innerHTML = `<div style="color:var(--chalk-dim); font-size:13px;">No comments in this range.</div>`;
    } else {
      listEl.innerHTML = allComments.slice(0,20).map(c=>
        `<div class="rt-comment-item"><div class="rt-c-meta">${c.name} \u2014 ${dateLabel(c.date)}</div>${c.comment}</div>`
      ).join('');
    }
  }

    }

    const statusByDate = {};

      let worst = 'good';

        if(s === 'red') worst = 'red';
        else if(s === 'amber' && worst !== 'red') worst = 'amber';
      });
      statusByDate[ds] = { status: worst, entries };
    }

    const monthLabel = firstOfMonth.toLocaleDateString(undefined, {month:'long', year:'numeric'});

      const info = statusByDate[ds];
      const status = isFuture ? 'na' : (info ? info.status : 'na');
      const isToday = ds === todayVal;

    }

    document.querySelectorAll('.rt-cal-cell[data-date]').forEach(cell=>{
      if(cell.dataset.empty || cell.classList.contains('future')) return;
      cell.onclick = ()=>{
        const ds = cell.dataset.date;
        const info = statusByDate[ds];
        const det = document.getElementById('rt-cal-detail');
        if(!info || !info.entries.length){ det.innerHTML = `<div class="rt-detail">No check-ins on ${dateLabel(ds)}.</div>`; return; }
        const sorted = info.entries.slice().sort((a,b)=>{
          const rank = s => s==='red'?0:s==='amber'?1:2;
          return rank(cellStatus(a)) - rank(cellStatus(b));
        });
        const rows = sorted.map(e=>{
          const s = cellStatus(e);
          let text;
          if(e.allGood) text = 'All good';
          else {
            text = Object.entries(e.flags||{}).map(([id,v])=>{
              const label = FLAGS.find(f=>f.id===id)?.label || id;
              return `${label} (${SEV_LABELS[v.severity]})`;
            }).join(', ');
          }
          const commentLine = e.comment ? ` &mdash; <em>"${e.comment}"</em>` : '';
          return `<div class="rt-profile-row ${s}"><span class="rt-profile-date">${e.name}</span><span>${text}${commentLine}</span></div>`;
        }).join('');
        det.innerHTML = `<div class="rt-detail"><div class="rt-profile-header">${dateLabel(ds)} \u2014 ${info.entries.length} check-ins</div>${rows}</div>`;
      };
    });
  }

  // ---------- COACH: PLAYERS PANEL (self-registered names + codes) ----------
  async function renderCoachCodes(){
    title.textContent = 'Players';
    body.innerHTML = `<div class="rt-loading">Loading players...</div>`;
    const players = await listPlayers();

    body.innerHTML = `
      <div class="rt-viewtabs">
        <button class="rt-btn rt-viewtab" data-view="grid">Grid</button>
        <button class="rt-btn rt-viewtab" data-view="calendar">Calendar</button>
        <button class="rt-btn rt-viewtab active" data-view="codes">Players</button>
      </div>
      <p style="color:var(--chalk-dim); font-size:13px;">
        Players set up their own name + code the first time they open the app \u2014 nothing for you to generate.
        If someone forgets their code or a name got taken by mistake, hit Reset below to free that name up
        so they can register again.
      </p>
      <div class="rt-recentlabel">Registered Players</div>
      <div id="rt-codes-list"></div>
    `;

    document.querySelectorAll('.rt-viewtab').forEach(b=> b.onclick = ()=>{
      if(b.dataset.view === 'grid') renderCoachDashboard(7);
      else if(b.dataset.view === 'calendar') renderCoachCalendar();
    });

    function renderPlayersList(list){
      const listEl = document.getElementById('rt-codes-list');
      if(!list.length){
        listEl.innerHTML = `<div style="color:var(--chalk-dim); font-size:13px;">No one has registered yet.</div>`;
        return;
      }
      listEl.innerHTML = list.map(p => `
        <div class="rt-code-row">
          <span class="rt-code-name">${p.name}</span>
          <span class="rt-code-value">${p.code}</span>
          <button class="rt-btn rt-code-reset" data-name="${p.name}">Reset</button>
        </div>
      `).join('');
      listEl.querySelectorAll('.rt-code-reset').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm(`Reset ${btn.dataset.name}'s account? They'll need to register again with a new code.`)) return;
          btn.disabled = true; btn.textContent = '...';
          await resetPlayer(btn.dataset.name);
          const refreshed = await listPlayers();
          renderPlayersList(refreshed);
        };
      });
    }
    renderPlayersList(players);
  }

  coachToggle.onclick = ()=>{
    coachMode = !coachMode;
    coachToggle.textContent = coachMode ? 'Player check-in' : 'Coach view';
    if(coachMode){
      coachUnlocked ? renderCoachDashboard(7) : renderCoachGate();
    } else {
      currentName ? renderCheckinScreen() : renderNameScreen();
    }
  };

  function updateDateBar(){
    const now = new Date();
    const dateEl = document.getElementById('rt-date');
    const clockEl = document.getElementById('rt-clock');
    if(dateEl) dateEl.textContent = now.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
    if(clockEl) clockEl.textContent = now.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  }
  updateDateBar();
  setInterval(updateDateBar, 30000);

  renderNameScreen();
})();
</script>
</body>
</html>
